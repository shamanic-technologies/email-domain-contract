name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI for Trusted Publishing support
        run: npm install -g npm@latest

      - run: npm install

      - run: npm test

      - run: npm run build

      # NOTE: NODE_AUTH_TOKEN is the bootstrap PAT. Once Trusted Publishing is
      # confirmed working on npmjs.com, delete the NPM_TOKEN repo secret and
      # remove the `env:` block — `npm publish --provenance` then auto-exchanges
      # the GitHub Actions OIDC token for a short-lived publish credential.
      - name: Publish to npm (with provenance)
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
