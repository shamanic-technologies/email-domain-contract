name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install

      - run: npm test

      - run: npm run build

      # NOTE: NODE_AUTH_TOKEN is the bootstrap PAT. `--provenance` is disabled:
      # it requires the bundled `sigstore` module, which a newer `npm@latest`
      # ships broken (`Cannot find module 'sigstore'`) — it failed the v1.2.0
      # publish. Trusted Publishing (OIDC) still 404s on npmjs.com anyway, so
      # provenance buys nothing today; publish with the NPM_TOKEN bootstrap PAT.
      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
