name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI for Trusted Publishing support
        run: npm install -g npm@latest

      - run: npm install

      - run: npm test

      - run: npm run build

      # NOTE: NODE_AUTH_TOKEN is the bootstrap PAT. Trusted Publishing was set
      # up on npmjs.com but consistently returns 404 — check the workflow
      # filename + repository fields on npm match this repo exactly. Once OIDC
      # is verified working, remove the `env:` block and revoke NPM_TOKEN.
      - name: Publish to npm (with provenance)
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
